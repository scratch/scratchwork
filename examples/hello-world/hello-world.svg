<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
<title id="title">Hello, world! — a storybook pastoral meadow at golden hour</title>
<desc id="desc">A soft hand-illustrated rolling green landscape under a warm peach golden-hour sky with dreamy clouds, a lone rounded tree crowning a hill with a winding path leading up to it, tiny clustered wildflowers with long soft shadows, and the hand-lettered words Hello, world tucked into the meadow.</desc>
