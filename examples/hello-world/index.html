<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world!</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #86c2ee;
      }

      body {

  <body>
    <img src="hello-world.svg" alt="A soft storybook landscape: rolling green hills under a bright blue sky with white clouds and a gentle sun, a lone rounded tree with a winding path, tiny wildflowers, and the hand-lettered words Hello, world! tucked into the meadow." />
