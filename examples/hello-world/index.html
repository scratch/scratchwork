<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world!</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #87c7ee;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <img src="hello-world.svg" alt="A pastoral scene with a blue sky, sun, clouds, rolling hills, wildflowers, and the words Hello, world!" />
  </body>
</html>
